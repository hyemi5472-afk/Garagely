function lookup(scope, path) {

        body: '렉카 기사님이 올린 파손 사진이에요. 보닛 접힘이 커서 판금 견적 같이 봐 주세요.', photos: [{ src: P.front, alt: '정면 파손' }, { src: P.bumper, alt: '우측 앞 사선 파손' }, { src: P.hood, alt: '엔진룸 앞쪽 파손' }] },
      { id: 3, kind: 'parts', urgent: false, plate: '55나 0701', time: '11:50', who: '[부품 담당]', comments: 3,
        body: 'K3 앞 범퍼, 그릴, 헤드램프 부품 입고됐어요. 상태 사진 올려요.', photos: [{ src: P.part, alt: '교체 부품 입고' }] },
      { id: 4, kind: 'notice', urgent: false, plate: '공지', time: '09:00', who: '[대표]', comments: 0,
        body: '이번 주 금요일 오후 도장 부스 점검이 있어요. 도장 일정은 목요일까지 맞춰 주세요.', photos: [] },
      { id: 5, kind: 'photo', urgent: false, plate: '55나 0701', time: '16:05', who: '김○미 (판금)', comments: 1,
        body: '보닛·범퍼 퍼티 샌딩 끝났어요. 도장 들어가기 전에 확인 부탁해요.', photos: [{ src: P.putty, alt: '퍼티 작업 완료' }] }
    ];
    const tags = { photo: ['사진 요청', '#1E4FA3', '#E3ECFB'], parts: ['부품', '#23662E', '#E2F3E4'], notice: ['공지', '#4A5260', '#EEF0F3'] };
    const labels = { all: '전체', photo: '사진 요청', parts: '부품', notice: '공지' };
    const filters = Object.keys(labels).map((k) => {
      const on = this.state.filter === k;
      return { name: labels[k], on: on ? 'true' : 'false', pick: () => this.setState({ filter: k }),
        style: 'min-height: 40px; padding: 0 14px; flex-shrink: 0; border-radius: 999px; font-family: inherit; font-size: 14px; font-weight: 700; ' + (on ? 'background: #1B2A41; color: #FFFFFF; border: none' : 'background: #FFFFFF; color: #1B2A41; border: 1px solid #C3C8D0') };
    });
    const done = this.state.done;
    const posts = all.filter((p) => this.state.filter === 'all' || p.kind === this.state.filter).map((p) => {
      const t = tags[p.kind], isDone = !!done[p.id];
      const urgentOpen = p.urgent && !isDone;
      return Object.assign({}, p, {
        urgent: urgentOpen,
        tag: t[0],
        tagStyle: 'font-size: 12px; font-weight: 700; padding: 2px 8px; border-radius: 999px; color: ' + t[1] + '; background: ' + t[2],
        hasPhotos: p.photos.length > 0,
        card: 'background: #FFFFFF; border-radius: 14px; padding: 14px; display: flex; flex-direction: column; gap: 8px; ' + (urgentOpen ? 'border: 2px solid #C0574D' : 'border: 1px solid #E2E5EA'),
        btn: p.kind === 'notice' ? '확인' : (isDone ? '완료됨' : (p.kind === 'photo' ? '사진 올리기' : '완료 표시')),
        toggle: () => this.setState({ done: Object.assign({}, done, { [p.id]: !isDone }) }),
        btnStyle: 'min-height: 40px; padding: 0 14px; border-radius: 10px; font-family: inherit; font-size: 13px; font-weight: 700; ' + (isDone ? 'background: #E2F3E4; color: #23662E; border: none' : 'background: #1B2A41; color: #FFFFFF; border: none')
      });
    });
    const urgentCount = all.filter((p) => p.urgent && !done[p.id]).length;
    return { filters, posts, urgentCount };
  }
}

window.addEventListener('hashchange', () => App.go());
App.go();
</script>
